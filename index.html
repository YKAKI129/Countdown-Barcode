<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKAKI - 3 Slide dengan Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- SLIDE CONTAINER --- */
        .slides-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out;
            background-color: #fff;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- HEADER (LOGO YKAKI TENGAH ATAS) --- */
        .header-logo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 30px;
            padding-bottom: 10px;
        }

        .header-logo img {
            width: 320px;
            height: auto;
            object-fit: contain;
        }

        /* --- KONTEN UTAMA (QR & TIMER BERDAMPINGAN DI TENGAH) --- */
        .content-container {
            display: flex;
            flex: 1;
            width: 100%;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 0 40px;
        }

        .qr-code {
            width: 280px;
            height: auto;
            border: 1px solid #eee;
            padding: 5px;
            background: #fff;
        }

        .countdown {
            font-size: 150px;
            font-weight: bold;
            color: #2c3e50;
            font-variant-numeric: tabular-nums;
            letter-spacing: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* --- NAVIGASI TOMBOL --- */
        .nav-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .nav-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nav-buttons button:hover {
            background-color: #2980b9;
        }

        .nav-buttons button.active-slide {
            background-color: #e74c3c;
        }

        /* --- INDIKATOR SLIDE --- */
        .slide-indicator {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 14px;
            color: #888;
            z-index: 100;
            background: rgba(255,255,255,0.8);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
        }

        /* --- RESPONSIF --- */
        @media (max-width: 768px) {
            .content-container {
                flex-direction: column;
                gap: 20px;
                justify-content: center;
                padding: 0 20px;
            }
            .qr-code {
                width: 180px;
            }
            .countdown {
                font-size: 70px;
            }
            .header-logo img {
                width: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="slide-indicator" id="slideIndicator">Slide 1 / 3</div>

    <div class="slides-wrapper">

        <!-- SLIDE 1 -->
        <div class="slide active" id="slide1">
            <div class="header-logo">
                <img src="https://ykaki.org/wp-content/uploads/2021/10/YKAKI-Logo-2.png" alt="Logo YKAKI">
            </div>
            <div class="content-container">
                <img src="22 Sep 2026.jpeg" alt="QR Code 1" class="qr-code">
                <div class="countdown" id="countdown1">03:00</div>
            </div>
        </div>

        <!-- SLIDE 2 -->
        <div class="slide" id="slide2">
            <div class="header-logo">
                <img src="https://ykaki.org/wp-content/uploads/2021/10/YKAKI-Logo-2.png" alt="Logo YKAKI">
            </div>
            <div class="content-container">
                <img src="22 Sep 2026.jpeg" alt="QR Code 2" class="qr-code">
                <div class="countdown" id="countdown2">03:00</div>
            </div>
        </div>

        <!-- SLIDE 3 -->
        <div class="slide" id="slide3">
            <div class="header-logo">
                <img src="https://ykaki.org/wp-content/uploads/2021/10/YKAKI-Logo-2.png" alt="Logo YKAKI">
            </div>
            <div class="content-container">
                <img src="22 Sep 2026.jpeg" alt="QR Code 3" class="qr-code">
                <div class="countdown" id="countdown3">02:00</div>
            </div>
        </div>

    </div>

    <div class="nav-buttons">
        <button onclick="goToSlide(0)" class="active-slide" id="btn0">Slide 1</button>
        <button onclick="goToSlide(1)" id="btn1">Slide 2</button>
        <button onclick="goToSlide(2)" id="btn2">Slide 3</button>
    </div>

    <script>
        // ==========================================
        // LOGIKA PERPINDAHAN SLIDE (MANUAL SAJA)
        // ==========================================
        const slides = document.querySelectorAll('.slide');
        const buttons = [
            document.getElementById('btn0'),
            document.getElementById('btn1'),
            document.getElementById('btn2')
        ];
        const indicator = document.getElementById('slideIndicator');
        let currentSlide = 0;
        const totalSlides = slides.length;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active-slide'));

            slides[index].classList.add('active');
            buttons[index].classList.add('active-slide');
            
            indicator.textContent = `Slide ${index + 1} / ${totalSlides}`;

            resetCountdown(index);
        }

        function goToSlide(index) {
            currentSlide = index;
            showSlide(currentSlide);
        }

        // ==========================================
        // LOGIKA COUNTDOWN (PER SLIDE)
        // ==========================================
        const timers = {};

        function startCountdown(slideIndex) {
            const element = document.getElementById(`countdown${slideIndex + 1}`);
            let timeLeft = 180; // 3 menit

            if (timers[slideIndex]) {
                clearInterval(timers[slideIndex]);
            }

            element.textContent = "03:00";

            timers[slideIndex] = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;

                const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
                const displaySeconds = seconds < 10 ? '0' + seconds : seconds;

                element.textContent = `${displayMinutes}:${displaySeconds}`;

                if (timeLeft <= 0) {
                    clearInterval(timers[slideIndex]);
                    element.textContent = "00:00";
                }
                timeLeft--;
            }, 1000);
        }

        function resetCountdown(slideIndex) {
            Object.keys(timers).forEach(key => {
                clearInterval(timers[key]);
            });
            startCountdown(slideIndex);
        }

        // ==========================================
        // INISIALISASI
        // ==========================================
        window.onload = function() {
            showSlide(0);
        };
    </script>

</body>
</html>
