<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKAKI - Pre-Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .slides-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out;
            background-color: #fff;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- HEADER (LOGO + PRE-TEST) --- */
        .header-logo {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 15px;
            padding-bottom: 5px;
        }

        .header-logo img {
            width: 400px;
            height: auto;
            object-fit: contain;
        }

        .pre-test-title {
            font-size: 40px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 25px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- KONTEN UTAMA --- */
        .content-container {
            display: flex;
            flex: 1;
            width: 100%;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 0 40px;
            padding-bottom: 70px;
        }

        .qr-code {
            width: 260px;
            height: auto;
            border: 1px solid #eee;
            padding: 5px;
            background: #fff;
        }

        .countdown {
            font-size: 130px;
            font-weight: bold;
            color: #2c3e50;
            font-variant-numeric: tabular-nums;
            letter-spacing: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* --- NAVIGASI TOMBOL --- */
        .nav-buttons {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .nav-buttons button {
            padding: 8px 18px;
            font-size: 14px;
            border: none;
            border-radius: 30px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nav-buttons button:hover {
            background-color: #2980b9;
        }

        .nav-buttons button.active-slide {
            background-color: #e74c3c;
        }

        .slide-indicator {
            position: fixed;
            top: 15px;
            right: 20px;
            font-size: 12px;
            color: #888;
            z-index: 100;
            background: rgba(255,255,255,0.8);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #ddd;
        }

        @media (max-width: 768px) {
            .content-container {
                flex-direction: column;
                gap: 15px;
                justify-content: center;
                padding: 0 20px;
                padding-bottom: 70px;
            }
            .qr-code {
                width: 170px;
            }
            .countdown {
                font-size: 65px;
            }
            .header-logo img {
                width: 150px;
            }
            .pre-test-title {
                font-size: 22px;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="slide-indicator" id="slideIndicator">Slide 1 / 3</div>

    <div class="slides-wrapper">

        <!-- SLIDE 1 -->
        <div class="slide active" id="slide1">
            <div class="header-logo">
                <img src="https://ykaki.org/wp-content/uploads/2021/10/YKAKI-Logo-2.png" alt="Logo YKAKI">
                <div class="pre-test-title">Pre-Test</div>
            </div>
            <div class="content-container">
                <!-- Src akan diisi oleh JavaScript -->
                <img alt="QR Code" class="qr-code qr-image">
                <div class="countdown" id="countdown1">03:00</div>
            </div>
        </div>

        <!-- SLIDE 2 -->
        <div class="slide" id="slide2">
            <div class="header-logo">
                <img src="https://ykaki.org/wp-content/uploads/2021/10/YKAKI-Logo-2.png" alt="Logo YKAKI">
                <div class="pre-test-title">Pre-Test</div>
            </div>
            <div class="content-container">
                <img alt="QR Code" class="qr-code qr-image">
                <div class="countdown" id="countdown2">03:00</div>
            </div>
        </div>

        <!-- SLIDE 3 -->
        <div class="slide" id="slide3">
            <div class="header-logo">
                <img src="https://ykaki.org/wp-content/uploads/2021/10/YKAKI-Logo-2.png" alt="Logo YKAKI">
                <div class="pre-test-title">Pre-Test</div>
            </div>
            <div class="content-container">
                <img alt="QR Code" class="qr-code qr-image">
                <div class="countdown" id="countdown3">03:00</div>
            </div>
        </div>

    </div>

    <div class="nav-buttons">
        <button onclick="goToSlide(0)" class="active-slide" id="btn0">Slide 1</button>
        <button onclick="goToSlide(1)" id="btn1">Slide 2</button>
        <button onclick="goToSlide(2)" id="btn2">Slide 3</button>
    </div>

    <script>
        // ==========================================
        // ★★★ CUKUP GANTI 1 LINK DI SINI ★★★
        // ==========================================
        const QR_LINK = "22 Sep 2026.jpeg";
        
        // Otomatis pasang link ke semua gambar QR di ketiga slide
        document.querySelectorAll('.qr-image').forEach(img => {
            img.src = QR_LINK;
        });

        // ==========================================
        // LOGIKA PERPINDAHAN SLIDE
        // ==========================================
        const slides = document.querySelectorAll('.slide');
        const buttons = [
            document.getElementById('btn0'),
            document.getElementById('btn1'),
            document.getElementById('btn2')
        ];
        const indicator = document.getElementById('slideIndicator');
        let currentSlide = 0;
        const totalSlides = slides.length;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active-slide'));

            slides[index].classList.add('active');
            buttons[index].classList.add('active-slide');
            
            indicator.textContent = `Slide ${index + 1} / ${totalSlides}`;

            resetCountdown(index);
        }

        function goToSlide(index) {
            currentSlide = index;
            showSlide(currentSlide);
        }

        // ==========================================
        // LOGIKA COUNTDOWN
        // ==========================================
        const timers = {};

        function startCountdown(slideIndex) {
            const element = document.getElementById(`countdown${slideIndex + 1}`);
            let timeLeft = 180;

            if (timers[slideIndex]) {
                clearInterval(timers[slideIndex]);
            }

            element.textContent = "03:00";

            timers[slideIndex] = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;

                const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
                const displaySeconds = seconds < 10 ? '0' + seconds : seconds;

                element.textContent = `${displayMinutes}:${displaySeconds}`;

                if (timeLeft <= 0) {
                    clearInterval(timers[slideIndex]);
                    element.textContent = "00:00";
                }
                timeLeft--;
            }, 1000);
        }

        function resetCountdown(slideIndex) {
            Object.keys(timers).forEach(key => {
                clearInterval(timers[key]);
            });
            startCountdown(slideIndex);
        }

        window.onload = function() {
            showSlide(0);
        };
    </script>

</body>
</html>
